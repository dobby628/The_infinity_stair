<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무한의 계단 (픽셀 v2)</title>
<style>
  html,body{margin:0;height:100%;background:#12141f;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{height:min(100vh,calc(100vw*1.5));width:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;box-shadow:0 0 30px #0008}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const g=document.createElement('canvas');g.width=120;g.height=180;const gx=g.getContext('2d');
const W=120,H=180,DX=16,DY=9,PI=Math.PI;
let best=0,selSkin=0,selBg=0;
try{best=+localStorage.getItem('stairs_best_pixel')||0;const s=JSON.parse(localStorage.getItem('stairs_pixel_sel')||'[0,0]');selSkin=s[0]|0;selBg=s[1]|0;}catch(e){}
const saveSel=()=>{try{localStorage.setItem('stairs_pixel_sel',JSON.stringify([selSkin,selBg]))}catch(e){}};

/* ---------- 3x5 픽셀 폰트 ---------- */
const F={A:'010/101/111/101/101',B:'110/101/110/101/110',C:'011/100/100/100/011',D:'110/101/101/101/110',E:'111/100/110/100/111',F:'111/100/110/100/100',G:'011/100/101/101/011',H:'101/101/111/101/101',I:'111/010/010/010/111',J:'001/001/001/101/010',K:'101/101/110/101/101',L:'100/100/100/100/111',M:'101/111/111/101/101',N:'110/101/101/101/101',O:'010/101/101/101/010',P:'110/101/110/100/100',R:'110/101/110/101/101',S:'011/100/010/001/110',T:'111/010/010/010/010',U:'101/101/101/101/111',V:'101/101/101/101/010',W:'101/101/111/111/101',X:'101/101/010/101/101',Y:'101/101/010/010/010',Z:'111/001/010/100/111',
'0':'111/101/101/101/111','1':'010/110/010/010/111','2':'111/001/111/100/111','3':'111/001/111/001/111','4':'101/101/111/001/001','5':'111/100/111/001/111','6':'111/100/111/101/111','7':'111/001/001/010/010','8':'111/101/111/101/111','9':'111/101/111/001/111','-':'000/000/111/000/000',':':'000/010/000/010/000','<':'001/010/100/010/001','+':'000/010/111/010/000','>':'100/010/001/010/100'};
function txt(s,x,y,sc,col,al){
  s=String(s).toUpperCase();const w=s.length*4*sc-sc;
  const px0=al==='c'?x-Math.floor(w/2):al==='r'?x-w:x;
  for(const [ox,oy,c] of [[1,1,'rgba(0,0,0,.5)'],[0,0,col]]){
    gx.fillStyle=c;let px=px0;
    for(const ch of s){
      const gl=F[ch];
      if(gl){const rows=gl.split('/');for(let r=0;r<5;r++)for(let c2=0;c2<3;c2++)if(rows[r][c2]==='1')gx.fillRect(px+c2*sc+ox,y+r*sc+oy,sc,sc);}
      px+=4*sc;
    }
  }
}

/* ---------- 스프라이트 (12x16, 오른쪽 방향) + 스킨 ---------- */
const SP={
idle:[
'....hhhh....','...hhhhhh...','...hsssss...','...sssses...','...sssss....','....ssss....',
'...oooooo...','..soooooos..','..soooooos..','..sooOOoos..','...oooooo...','...pppppp...',
'...pp..pp...','...pp..pp...','...bb..bb...','...bb..bb...'],
step:[
'....hhhh....','...hhhhhh...','...hsssss...','...sssses...','...sssss....','....ssss....',
'...oooooo...','.s.oooooo.s.','..soooooos..','..sooOOoos..','...oooooo...','...pppppp...',
'...pp.ppp...','...pp..ppb..','...pp.......','...bb.......']};
const R=(r,a,b,c)=>Array.from({length:b-a+1},(_,i)=>[a+i,r,c]);
const SK=[
 {n:'BASIC',u:0,pal:{h:'#4a2c1a',s:'#ffd2a8',o:'#ff7a1a',O:'#c85a0a',p:'#2b3a55',b:'#14141f',e:'#111'},acc:[]},
 {n:'MAEHWA',u:0,pal:{h:'#15121c',s:'#ffe0c8',o:'#f4f1ea',O:'#c3bdd0',p:'#1f2a52',b:'#14141f',e:'#111'},
  fx:'sword',blade:'#e8eef8',hilt:'#8a5a2a',trail:[255,190,215],
  acc:[[6,-1,'#15121c'],[6,-2,'#15121c'],[7,-1,'#e0507a'],...R(10,3,8,'#e0507a'),[5,8,'#f08aa6'],[7,7,'#f08aa6']],
  back:[[1,3,'#6b4a2a'],[1,4,'#6b4a2a'],...Array.from({length:8},(_,i)=>[1,5+i,'#cfd6e4'])]},
 {n:'NINJA',u:30,pal:{h:'#22222f',s:'#2a2a3d',o:'#2a2a3d',O:'#1a1a28',p:'#1a1a28',b:'#0d0d14',e:'#fff'},fx:'ghost',
  acc:[[6,3,'#fff'],...R(5,4,7,'#e03a3a'),[2,5,'#e03a3a'],[1,6,'#e03a3a'],[0,6,'#e03a3a']]},
 {n:'KNIGHT',u:60,pal:{h:'#8d99ad',s:'#ffd2a8',o:'#b8c4d4',O:'#7e8aa0',p:'#59657a',b:'#2b3140',e:'#111'},
  fx:'sword',blade:'#dfe6f2',hilt:'#c9a227',trail:[220,230,255],
  acc:[[5,-1,'#e03a3a'],[6,-1,'#e03a3a'],[6,-2,'#e03a3a'],[7,-2,'#e03a3a']]},
 {n:'GOLD',u:100,pal:{h:'#a8741a',s:'#ffe0a0',o:'#ffd84a',O:'#d9a520',p:'#8a5a14',b:'#5a3a0a',e:'#111'},fx:'spark',
  acc:[...R(-1,4,7,'#ffd84a'),[4,-2,'#ffd84a'],[6,-2,'#ffd84a']]}];
const unlocked=i=>best>=SK[i].u;
function spr(map,x,y,flip,sk,an){
  const w=12,h=16,x0=Math.round(x-w/2),y0=Math.round(y-h),pal=sk.pal;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const ch=map[r][c];if(ch==='.')continue;
    gx.fillStyle=pal[ch];gx.fillRect(flip?x0+(w-1-c):x0+c,y0+r,1,1);
  }
  for(const [c,r,col] of sk.acc){gx.fillStyle=col;gx.fillRect(flip?x0+(w-1-c):x0+c,y0+r,1,1);}
  if(sk.back&&!(sk.fx==='sword'&&an>0))for(const [c,r,col] of sk.back){gx.fillStyle=col;gx.fillRect(flip?x0+(w-1-c):x0+c,y0+r,1,1);}
}
/* 스킨 전용 연출: sword=검 휘두르기(궤적 포함), ghost=잔상, spark=반짝임. ph0=캐릭터 뒤, ph1=캐릭터 앞 */
function skinFx(sk,x,y,flip,an,ph){
  if(an<=0||!sk.fx)return;
  const x0=Math.round(x-6),y0=Math.round(y-16),dir=flip?-1:1;
  if(sk.fx==='ghost'){
    if(ph!==0)return;
    for(let k=1;k<=2;k++){gx.globalAlpha=0.38/k;spr(an>0.5?SP.step:SP.idle,x-dir*k*3,y+k*2,flip,sk,0);}
    gx.globalAlpha=1;return;
  }
  if(ph!==1)return;
  if(sk.fx==='sword'){
    const p=1-an,e=p*p*(3-2*p),ang=(-130+180*e)*PI/180,sx=x0+(flip?5:6),sy=y0+7;
    for(let k=1;k<=9;k++){                       // 베기 궤적
      const aa=ang-k*0.14,al=(1-k/10)*0.75;
      gx.fillStyle='rgba('+sk.trail[0]+','+sk.trail[1]+','+sk.trail[2]+','+al+')';
      for(let r=9;r<=12;r++)gx.fillRect(Math.round(sx+dir*Math.cos(aa)*r),Math.round(sy+Math.sin(aa)*r),1,1);
    }
    for(let i=2;i<=13;i++){                      // 검 (손잡이 + 칼날)
      gx.fillStyle=i<=4?sk.hilt:sk.blade;
      gx.fillRect(Math.round(sx+dir*Math.cos(ang)*i),Math.round(sy+Math.sin(ang)*i),1,1);
    }
    gx.fillStyle='#fff';gx.fillRect(Math.round(sx+dir*Math.cos(ang)*14),Math.round(sy+Math.sin(ang)*14),1,1);
  }else if(sk.fx==='spark'){
    gx.fillStyle='#fff6a0';
    for(let i=0;i<5;i++){const a=i*1.26+an*6;gx.fillRect(Math.round(x+Math.cos(a)*9),Math.round(y-9+Math.sin(a)*9),1,1);}
  }
}
function drawChar(sk,x,y,flip,an){
  let map=SP.idle,oy=0;
  if(an>0.7){map=SP.step;oy=-2;}else if(an>0.3){map=SP.step;oy=-1;}
  skinFx(sk,x,y+oy,flip,an,0);spr(map,x,y+oy,flip,sk,an);skinFx(sk,x,y+oy,flip,an,1);
}

/* ---------- 게임 상태 ---------- */
let overAt=0,dirs,xs,floor,facing,state,gauge,dispF,dispX,camX,camY,shake,fall,pressA=0,pressB=0,anim=0,parts=[],last=0,newSkin='',curSkin=0;
function gen(i){const p=dirs[i-1];let run=0;for(let j=i-1;j>=2&&dirs[j]!==dirs[j-1]&&run<3;j--)run++;const pf=run===0?0.28:run===1?0.2:run===2?0.1:0;dirs[i]=Math.random()<pf?-p:p;xs[i]=xs[i-1]+dirs[i]*DX;}
function reset(){
  dirs=[0,1];xs=[0,DX];for(let i=2;i<60;i++)gen(i);
  floor=0;facing=1;state='ready';gauge=1;anim=0;parts=[];newSkin='';
  dispF=0;dispX=0;camX=0;camY=0;shake=0;fall=null;
  if(!unlocked(selSkin))selSkin=0;
}
reset();
function act(turn){
  if(state==='dead'||state==='over')return;
  if(state==='ready'){state='play';curSkin=selSkin;}
  if(turn){facing=-facing;pressA=1}else pressB=1;
  if(facing!==dirs[floor+1]){die();return;}
  floor++;while(dirs.length<floor+60)gen(dirs.length);
  gauge=Math.min(1,gauge+0.045);anim=1;sfxStep();
  const px=W/2+dispX-camX,py=H*0.6-(dispF*DY-camY);
  for(let i=0;i<4;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*40,vy:-10-Math.random()*25,l:0.35});
}
function die(){
  state='dead';shake=4;sfxDie();
  fall={x:dispX,y:0,vy:-80,vx:facing*18,t:0};
  if(floor>best){
    const pb=best;best=floor;try{localStorage.setItem('stairs_best_pixel',best)}catch(e){}
    for(const s of SK)if(s.u>pb&&s.u<=best)newSkin=s.n;
  }
  setTimeout(()=>{if(state==='dead'){state='over';overAt=performance.now();}},600);
}
const LEFT=new Set(['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Tab','CapsLock','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyA','KeyS','KeyD','KeyF','KeyG','KeyZ','KeyX','KeyC','KeyV','KeyB','ShiftLeft','ControlLeft','AltLeft','ArrowLeft','Escape']);

/* ---------- 키 설정 ---------- */
let KM={turn:[],climb:[]},keyTarget=null,keyWarn=0;
try{const k=JSON.parse(localStorage.getItem('stairs_pixel_keys')||'null');if(k&&Array.isArray(k.turn)&&Array.isArray(k.climb))KM=k;}catch(e){}
const saveKM=()=>{try{localStorage.setItem('stairs_pixel_keys',JSON.stringify(KM))}catch(e){}};
const custom=()=>KM.turn.length||KM.climb.length;
function actionFor(c){
  if(custom())return KM.turn.includes(c)?'turn':KM.climb.includes(c)?'climb':null;
  return LEFT.has(c)?'turn':'climb';
}
const KL={Space:'SPC',Enter:'ENT',Tab:'TAB',ShiftLeft:'SHF',ShiftRight:'SHF',ControlLeft:'CTL',ControlRight:'CTL',AltLeft:'ALT',AltRight:'ALT',ArrowLeft:'<',ArrowRight:'>',ArrowUp:'UP',ArrowDown:'DN',Semicolon:'SC',Comma:'CM',Period:'PD',Slash:'SL',Quote:'QT',BracketLeft:'BL',BracketRight:'BR',Backslash:'BS',IntlBackslash:'BS',Minus:'-',Equal:'EQ',Backquote:'BQ',Backspace:'BKS',CapsLock:'CAP'};
function lab(c){return KL[c]||(c.startsWith('Key')?c[3]:c.startsWith('Digit')?c[5]:c.startsWith('Numpad')?'N'+c.slice(6,9):c.toUpperCase().slice(0,4));}
function keyAssign(c){
  if(c==='Escape'){keyTarget=null;return;}
  if(!keyTarget)return;
  const o=keyTarget==='turn'?'climb':'turn';
  KM[o]=KM[o].filter(k=>k!==c);
  if(KM[keyTarget].includes(c))KM[keyTarget]=KM[keyTarget].filter(k=>k!==c);
  else if(KM[keyTarget].length<12)KM[keyTarget].push(c);
  saveKM();
}
const KB=[['turn',6,122,50,14,'+TURN'],['climb',64,122,50,14,'+CLIMB'],['reset',6,140,50,14,'RESET'],['done',64,140,50,14,'DONE']];
function sbtn(x,y,w,h,label,on){
  gx.fillStyle='#0b1230';gx.fillRect(x,y,w,h);
  gx.fillStyle=on?'#e0b020':'#3a58b0';gx.fillRect(x+1,y+1,w-2,h-2);
  txt(label,x+Math.floor(w/2),y+Math.floor((h-5)/2),1,on?'#2a1e00':'#fff','c');
}
function klist(list,y0){
  let x=6,y=y0;
  if(!list.length){txt('-',x,y,1,'#566');return;}
  for(const c of list){
    const s=lab(c),w=s.length*4+2;
    if(x+w>114){x=6;y+=9;}
    gx.fillStyle='#1d2a55';gx.fillRect(x-1,y-1,w+1,7);txt(s,x,y,1,'#fff');x+=w+3;
  }
}
function drawKeys(){
  gx.fillStyle='#0b1028';gx.fillRect(0,0,W,H);
  txt('KEY SETUP',W/2,5,2,'#ffd84a','c');
  txt('TURN',6,22,1,'#9fe8ff');klist(KM.turn,32);
  txt('CLIMB',6,66,1,'#9fe8ff');klist(KM.climb,76);
  const bl=Math.floor(performance.now()/350)%2===0;
  if(keyTarget){if(bl)txt('PRESS A KEY: '+keyTarget,W/2,108,1,'#ffd84a','c');}
  else txt('TAP +TURN OR +CLIMB',W/2,108,1,'#8fa0c0','c');
  if(keyWarn>0)txt('SET BOTH TURN AND CLIMB',W/2,114,1,'#ff5a6e','c');
  for(const [id,x,y,w,h,l] of KB)sbtn(x,y,w,h,l,id===keyTarget);
  txt('BOTH EMPTY: ANY KEY MODE',W/2,162,1,'#8fa0c0','c');
}

/* ---------- 픽셀 음악 (WebAudio 칩튠, 파일 없음) ---------- */
let ac=null,master=null,musicGain=null,sfxGain=null,noiseBuf=null,seqTimer=0,nextT=0,stepI=0,vm=0.6,vs=0.7;
try{const v=JSON.parse(localStorage.getItem('stairs_pixel_vol')||'null');if(v){vm=+v[0];vs=+v[1];}}catch(e){}
const saveVol=()=>{try{localStorage.setItem('stairs_pixel_vol',JSON.stringify([vm,vs]))}catch(e){}};
function applyVol(){
  if(!ac)return;
  musicGain.gain.setTargetAtTime(vm*(state==='over'?0.3:1),ac.currentTime,0.15);
  sfxGain.gain.setTargetAtTime(vs,ac.currentTime,0.05);
}
function ensureAudio(){
  if(!ac){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
      musicGain=ac.createGain();musicGain.gain.value=vm;musicGain.connect(master);
      sfxGain=ac.createGain();sfxGain.gain.value=vs;sfxGain.connect(master);
      noiseBuf=ac.createBuffer(1,ac.sampleRate>>1,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ac=null;return;}
  }
  if(ac.state==='suspended')ac.resume();
  if(!seqTimer){nextT=ac.currentTime+0.1;stepI=0;seqTimer=setInterval(seq,30);}
}
function tone(f,t,d,type,v,dest,sl){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.02);
}
function nz(t,d,v,hp){
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+d+0.02);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
/* 곡: 8마디 루프, 코드 진행 C-G-Am-F x2, 통통 튀는 베이스 + 4박 킥/스네어 + 오프비트 코드 스탭 */
const MAJ=[0,2,4,5,7,9,11];
const CH=[0,4,5,3,0,4,5,3];
const MELODY=[7,-1,7,6,7,4,2,4, 6,-1,6,5,6,4,1,4, 5,-1,5,4,5,7,9,7, 3,5,7,5,3,5,7,-1,
              4,7,9,7,4,7,9,10, 8,6,4,6,8,6,4,1, 9,7,5,7,9,7,5,4, 3,5,7,5,4,6,8,-1];
const TRK=[
 {root:60,sc:MAJ,bpm:150,wave:'square',lv:0.045,len:0.8,steps:64,lead:MELODY,chords:CH,stab:1},   // SKY
 {root:62,sc:[0,2,4,7,9],bpm:128,wave:'triangle',lv:0.11,len:0.6,steps:32,stab:0,                  // HWASAN: 활기찬 동양풍 펜타토닉
  lead:[5,7,5,4,2,4,5,-1, 7,8,7,5,8,7,5,-1, 9,8,7,5,7,8,9,-1, 8,7,5,4,2,4,5,7],chords:[0,3,4,3]},
 {root:57,sc:MAJ,bpm:138,wave:'square',lv:0.04,len:0.8,steps:64,lead:MELODY,chords:CH,stab:1},     // SUNSET
 {root:64,sc:MAJ,bpm:162,wave:'square',lv:0.04,len:0.75,steps:64,lead:MELODY,chords:CH,stab:1}];   // CYBER
function dm(tr,d,oct){const L=tr.sc.length,o=Math.floor(d/L),i=((d%L)+L)%L;return tr.root+tr.sc[i]+12*o+oct;}
function playStep(tr,s,t,sl){
  const L=tr.sc.length,l=tr.lead[s];
  if(l>=0)tone(mf(dm(tr,l,0)),t,sl*tr.len,tr.wave,tr.lv,musicGain);
  const r=tr.chords[Math.floor(s/8)%tr.chords.length];
  tone(mf(dm(tr,s%2===0?r:r+L,-24)),t,sl*0.9,'triangle',0.15,musicGain);            // 옥타브 바운스 베이스
  if(tr.stab&&s%4===3)for(const k of [0,2,4])tone(mf(dm(tr,r+k,-12)),t,sl*0.5,'square',0.014,musicGain);
  const m=s%8;
  if(m===0||m===4)tone(150,t,0.12,'sine',0.22,musicGain,40);                         // 킥
  if(m===2||m===6)nz(t,0.09,0.08,1800);                                              // 스네어
  nz(t,0.025,0.04,7000);                                                             // 하이햇
}
function seq(){
  if(!ac)return;
  if(vm<=0||state==='keys'){nextT=Math.max(nextT,ac.currentTime+0.05);return;}
  const tr=TRK[selBg],bpm=tr.bpm*(1+Math.min(floor,150)/900),sl=60/bpm/2;
  while(nextT<ac.currentTime+0.12){playStep(tr,stepI%tr.steps,nextT,sl);nextT+=sl;stepI++;}
}
function sfxStep(){if(!ac)return;tone(740,ac.currentTime,0.05,'square',0.05,sfxGain);}   // 항상 같은 음높이
function sfxDie(){if(!ac)return;tone(380,ac.currentTime,0.5,'square',0.07,sfxGain,50);}

/* ---------- 사운드 설정 화면 ---------- */
const SLY=[44,84];let drag=-1;
function sliderAt(y){for(let i=0;i<2;i++)if(y>=SLY[i]-8&&y<SLY[i]+16)return i;return -1;}
function setSlider(i,x){
  const v=Math.max(0,Math.min(1,(x-10)/100));
  if(i===0)vm=v;else vs=v;
  saveVol();applyVol();
}
function drawSound(){
  gx.fillStyle='#0b1028';gx.fillRect(0,0,W,H);
  txt('SOUND',W/2,5,2,'#ffd84a','c');
  [['MUSIC',vm],['EFFECT',vs]].forEach(([n,v],i)=>{
    const y=SLY[i];
    txt(n,10,y-12,1,'#9fe8ff');txt(Math.round(v*100),110,y-12,1,'#fff','r');
    gx.fillStyle='#14203f';gx.fillRect(9,y-1,102,10);
    gx.fillStyle='#2b3a55';gx.fillRect(10,y,100,8);
    gx.fillStyle='#4cd964';gx.fillRect(10,y,Math.round(v*100),8);
    gx.fillStyle='#fff';gx.fillRect(10+Math.round(v*100)-1,y-2,3,12);
  });
  txt('TAP OR DRAG THE BAR',W/2,112,1,'#8fa0c0','c');
  sbtn(36,140,48,14,'DONE',false);
}
function xyOf(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointermove',e=>{if(state==='sound'&&drag>=0)setSlider(drag,xyOf(e)[0]);});
const endDrag=()=>{if(drag===1)sfxStep();drag=-1;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- 입력 ---------- */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey)return;e.preventDefault();if(e.repeat)return;
  ensureAudio();
  if(state==='keys'){keyAssign(e.code);return;}
  if(state==='sound'){if(e.code==='Escape'||e.code==='Enter')state='ready';return;}
  if(state==='over'){if(performance.now()-overAt>300)reset();return;}
  const a=actionFor(e.code);
  if(a)act(a==='turn');
},true);
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  ensureAudio();
  if(state==='keys'){
    for(const [id,bx,by,bw,bh] of KB)if(x>=bx&&x<bx+bw&&y>=by&&y<by+bh){
      if(id==='turn'||id==='climb')keyTarget=keyTarget===id?null:id;
      else if(id==='reset'){KM={turn:[],climb:[]};keyTarget=null;saveKM();}
      else{if(!custom()||(KM.turn.length&&KM.climb.length)){keyTarget=null;state='ready';}else keyWarn=1.5;}
    }
    return;
  }
  if(state==='sound'){
    if(x>=36&&x<84&&y>=140&&y<154){state='ready';return;}
    const i=sliderAt(y);if(i>=0){drag=i;setSlider(i,x);if(i===1)sfxStep();}
    return;
  }
  if(state==='over'){if(performance.now()-overAt>300)reset();return;}
  if(state==='ready'){
    if(y<16){
      if(x<32){keyTarget=null;state='keys';}
      else if(x>88){state='sound';}
      return;
    }
    if(y>=98&&y<122){   // 스킨/배경 선택 줄
      const d=x<W/2?-1:1;
      if(y<110){let i=selSkin;do{i=(i+d+SK.length)%SK.length;}while(!unlocked(i));selSkin=i;}
      else selBg=(selBg+d+TH.length)%TH.length;
      saveSel();return;
    }
  }
  act(x<W/2);
});

/* ---------- 업데이트 ---------- */
function update(dt){
  if(ac)applyVol();
  keyWarn=Math.max(0,keyWarn-dt);
  if(state==='play'){gauge-=dt*(0.22+Math.min(floor,400)*0.0016);if(gauge<=0){gauge=0;die();}}
  dispX+=(xs[floor]-dispX)*Math.min(1,dt*22);dispF+=(floor-dispF)*Math.min(1,dt*22);
  camX+=(dispX-camX)*Math.min(1,dt*8);camY+=(dispF*DY-camY)*Math.min(1,dt*10);
  pressA=Math.max(0,pressA-dt*8);pressB=Math.max(0,pressB-dt*8);
  anim=Math.max(0,anim-dt*6);shake=Math.max(0,shake-dt*14);
  if(fall){fall.vy+=330*dt;fall.y+=fall.vy*dt;fall.x+=fall.vx*dt;fall.t+=dt;}
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;}
}

/* ---------- 배경 ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
const rgb=(c,d,t)=>`rgb(${lerp(c[0],d[0],t)|0},${lerp(c[1],d[1],t)|0},${lerp(c[2],d[2],t)|0})`;
function bands(cols){
  for(let j=0;j<5;j++){gx.fillStyle=cols[j];gx.fillRect(0,j*36,W,36);}
  for(let j=1;j<5;j++){gx.fillStyle=cols[j-1];for(let x=0;x<W;x+=2){gx.fillRect(x,j*36,1,1);gx.fillRect(x+1,j*36+1,1,1);}}
}
const STARS=Array.from({length:36},(_,i)=>[(i*37+11)%W,(i*53+7)%150]);
const CLOUDS=[[10,20,1],[70,60,0.8],[40,100,1.2],[95,140,0.9],[20,170,1],[80,0,1.1]];
function clouds(col,a,par){
  gx.globalAlpha=a;gx.fillStyle=col;
  for(const [cx,cy,s] of CLOUDS){
    const y=Math.round(((cy+camY*par)%210+210)%210-15),x=Math.round(cx+Math.sin(performance.now()/4000+cy)*3);
    gx.fillRect(x,y,Math.round(14*s),3);gx.fillRect(x+2,y-2,Math.round(9*s),2);gx.fillRect(x+4,y-3,Math.round(4*s),1);
  }
  gx.globalAlpha=1;
}
function fx(cols,vx,vy){            // 떨어지는 입자
  const t=performance.now()/1000;
  for(let i=0;i<22;i++){
    const x=(((i*37+t*vx+Math.sin(t+i)*4)%W)+W)%W,y=(((i*53+t*vy+camY*0.3)%H)+H)%H;
    gx.fillStyle=cols[i%cols.length];gx.fillRect(x|0,y|0,i%3===0?2:1,i%3===0?2:1);
  }
}
const DAY=[[110,198,255],[143,211,255],[176,224,255],[207,238,255],[230,246,255]];
const NIGHT=[[11,16,48],[20,27,74],[31,43,106],[45,60,138],[68,87,170]];
function bgSky(){
  const t=Math.min(1,floor/160);
  bands(DAY.map((d,j)=>rgb(d,NIGHT[j],t)));
  if(t>0.35){gx.fillStyle='#fff';const tm=performance.now()/500;STARS.forEach((s,i)=>{if((tm+i)%4<3.3)gx.fillRect(s[0],s[1],1,1);});}
  clouds('#fff',1-t*0.75,0.18);
}
function mount(base,amp,f1,f2,seed,col,par){
  const by=base+Math.round(camY*par);gx.fillStyle=col;
  const hf=x=>Math.round(amp*(0.55+0.3*Math.sin(x*f1+seed)+0.15*Math.sin(x*f2+seed*1.7)));
  for(let x=0;x<W;x++){const h=hf(x);if(by-h<H)gx.fillRect(x,by-h,1,H-(by-h));}
  return x=>by-hf(x);
}
function pagoda(x,y){
  gx.fillStyle='#2f4150';gx.fillRect(x-3,y-5,6,5);gx.fillRect(x-1,y-12,2,2);
  gx.fillStyle='#8a3a36';gx.fillRect(x-6,y-7,12,2);gx.fillRect(x-4,y-10,8,2);gx.fillRect(x-2,y-13,4,1);
}
function branch(fl){
  for(let i=0;i<36;i++){
    const x=fl?W-1-i:i,y=Math.round(6+i*0.3+Math.sin(i/4)*1.5);
    gx.fillStyle='#3a2a30';gx.fillRect(x,y,1,2);
    if(i%6===3){const bx=x,by=y-2;
      gx.fillStyle='#f6a6bd';gx.fillRect(bx,by-1,1,1);gx.fillRect(bx-1,by,1,1);gx.fillRect(bx+1,by,1,1);gx.fillRect(bx,by+1,1,1);
      gx.fillStyle='#e0507a';gx.fillRect(bx,by,1,1);}
  }
}
function bgHwa(){
  bands(['#cfdde6','#dce7ec','#e8eeee','#f1f1ea','#f6efe4']);
  gx.fillStyle='#fff3cf';for(let y=-8;y<=8;y++)for(let x=-8;x<=8;x++)if(x*x+y*y<=64)gx.fillRect(92+x,34+y+Math.round(camY*0.03),1,1);
  mount(118,40,0.07,0.19,1.3,'#b8c9d1',0.06);
  const mid=mount(138,46,0.06,0.17,4.1,'#8aa1ae',0.12);
  pagoda(28,mid(28)+1);
  gx.globalAlpha=0.4;gx.fillStyle='#fff';gx.fillRect(0,128+Math.round(camY*0.12),W,8);gx.globalAlpha=1;
  mount(168,38,0.05,0.23,7.7,'#51697a',0.22);
  for(const [ix,iy] of [[16,30],[84,72],[44,120],[96,150],[8,170]]){   // 떠 있는 바위섬 + 소나무
    const y=Math.round(((iy+camY*0.3)%220+220)%220-20),x=ix;
    gx.fillStyle='#6f8795';gx.fillRect(x,y,12,2);gx.fillRect(x+1,y+2,10,2);gx.fillRect(x+3,y+4,6,2);gx.fillRect(x+5,y+6,2,2);
    gx.fillStyle='#3a4a3a';gx.fillRect(x+6,y-3,1,3);
    gx.fillStyle='#3f5c4a';gx.fillRect(x+4,y-4,5,2);gx.fillRect(x+5,y-6,3,2);
  }
  clouds('#fff',0.55,0.25);
  fx(['#f6a6bd','#ffffff','#f08aa6','#f6a6bd'],9,16);   // 매화 꽃잎
  branch(false);branch(true);
}
function bgSun(){
  const t=Math.min(1,floor/200);
  bands([[43,27,77],[107,44,122],[192,70,122],[240,138,90],[255,208,138]].map((c,j)=>rgb(c,[[10,8,30],[24,14,52],[44,22,76],[70,34,92],[96,48,100]][j],t)));
  const sy=150+Math.round(camY*0.12);gx.fillStyle='#fff0c8';
  if(sy<H+14)for(let y=-12;y<=12;y++)for(let x=-12;x<=12;x++)if(x*x+y*y<=144)gx.fillRect(60+x,sy+y,1,1);
  if(t>0.4){gx.fillStyle='#fff';const tm=performance.now()/500;STARS.forEach((s,i)=>{if((tm+i)%4<3.3)gx.fillRect(s[0],s[1],1,1);});}
  clouds('#f7a98a',0.7-t*0.4,0.15);
}
function bgCyber(){
  gx.fillStyle='#070714';gx.fillRect(0,0,W,H);
  gx.fillStyle='#0f1c3c';
  for(let x=0;x<W;x+=15)gx.fillRect(x,0,1,H);
  const o=(camY*0.5)%15;for(let y=-15+o;y<H;y+=15)gx.fillRect(0,Math.round(y),W,1);
  [[8,'#ff2bd6',10],[40,'#2bd6ff',6],[78,'#ff2bd6',8],[104,'#2bd6ff',12]].forEach(([x,c,w],i)=>{
    const y=Math.round(((i*60+camY*0.2)%260+260)%260-40);
    gx.globalAlpha=0.25;gx.fillStyle=c;gx.fillRect(x,y,3,w*4);gx.globalAlpha=1;gx.fillStyle=c;gx.fillRect(x,y,3,1);
  });
  fx(['#2bd6ff','#ff2bd6','#7dfcff'],0,28);
}
const TH=[
 {n:'SKY',bg:bgSky,st:{o:'#3b2f1c',top:'#e6d8a8',ctop:'#fff6c0',mid:'#b39c6a',dark:'#7d6841',joint:'#977f52',num:'#3b2f1c'}},
 {n:'HWASAN',bg:bgHwa,petal:1,st:{o:'#2a2f38',top:'#d8d4ca',ctop:'#ffffff',mid:'#8e8a86',dark:'#5b5853',joint:'#706c67',num:'#2a2f38'}},
 {n:'SUNSET',bg:bgSun,st:{o:'#2a1630',top:'#f3c7a0',ctop:'#fff0c8',mid:'#c9807a',dark:'#7a3f5c',joint:'#a85d6a',num:'#2a1630'}},
 {n:'CYBER',bg:bgCyber,st:{o:'#00e5ff',top:'#1d6a86',ctop:'#7dfcff',mid:'#101a33',dark:'#0a1022',joint:'#16305a',num:'#7dfcff'}}];

/* ---------- 그리기 ---------- */
function stepBlock(x,y,cur,i,s,petal){
  const x0=x-7;
  gx.fillStyle=s.o;gx.fillRect(x0-1,y-1,16,10);
  gx.fillStyle=cur?s.ctop:s.top;gx.fillRect(x0,y,14,2);
  gx.fillStyle=s.mid;gx.fillRect(x0,y+2,14,4);
  gx.fillStyle=s.dark;gx.fillRect(x0,y+6,14,2);
  gx.fillStyle=s.joint;gx.fillRect(x0+4,y+2,1,4);gx.fillRect(x0+9,y+2,1,4);
  if(petal){gx.fillStyle='#f6a6bd';gx.fillRect(x0+(i*5)%12+1,y,1,1);gx.fillRect(x0+(i*7)%11+2,y+1,1,1);}
  if(i%10===0&&i>0)txt(i,x,y+2,1,s.num,'c');
}
function btn(x,y,w,h,label,hint,p){
  const o=p>0?1:0;
  gx.fillStyle='#14203f';gx.fillRect(x,y,w,h);
  gx.fillStyle=p>0?'#3d5fb8':'#4a6fd0';gx.fillRect(x+1,y+1+o,w-2,h-3);
  gx.fillStyle='#7fa2f0';gx.fillRect(x+1,y+1+o,w-2,1);gx.fillRect(x+1,y+1+o,1,h-3);
  gx.fillStyle='#27408b';gx.fillRect(x+1,y+h-3,w-2,2);
  txt(label,x+w/2,y+6+o,2,'#fff','c');
  txt(hint,x+w/2,y+h-10+o,1,'#cfe0ff','c');
}
function draw(){
  const th=TH[selBg],sk=SK[state==='ready'?selSkin:curSkin];
  gx.save();
  if(shake>0.2)gx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
  th.bg();
  const lo=Math.max(0,floor-8),hi=floor+14;
  for(let i=hi;i>=lo;i--)stepBlock(Math.round(W/2+xs[i]-camX),Math.round(H*0.6-(i*DY-camY)),i===floor,i,th.st,th.petal);
  let px=W/2+dispX-camX,py=H*0.6-(dispF*DY-camY);
  if(fall){px=W/2+fall.x-camX;py+=fall.y;}
  if(state!=='ready'){
    if(!fall){gx.fillStyle='rgba(0,0,0,.25)';gx.fillRect(Math.round(px)-4,Math.round(py),8,1);}
    const flip=fall?(Math.floor(fall.t*12)%2===0?facing===-1:facing===1):facing===-1;
    drawChar(sk,px,py,flip,fall?0:anim);
  }
  gx.fillStyle=th.petal?'#f6a6bd':'#efe6cc';for(const p of parts)gx.fillRect(Math.round(p.x),Math.round(p.y),1,1);

  // HUD
  txt(floor,W/2,4,3,'#fff','c');
  txt('FLOOR '+floor+'  BEST '+best,W/2,22,1,'#fff','c');
  gx.fillStyle='#14203f';gx.fillRect(9,29,102,8);
  gx.fillStyle='#2b3a55';gx.fillRect(10,30,100,6);
  const low=gauge<0.25,blink=Math.floor(performance.now()/150)%2===0;
  gx.fillStyle=low&&blink?'#ff8a9a':low?'#ff3b5c':'#4cd964';
  gx.fillRect(10,30,Math.round(100*gauge),6);
  gx.fillStyle='rgba(255,255,255,.35)';gx.fillRect(10,30,Math.round(100*gauge),1);
  btn(4,146,54,30,'TURN',KM.turn.length?KM.turn.slice(0,3).map(lab).join(' '):'LEFT KEY',pressA);
  btn(62,146,54,30,'CLIMB',KM.climb.length?KM.climb.slice(0,3).map(lab).join(' '):'RIGHT KEY',pressB);

  const bl=Math.floor(performance.now()/450)%2===0;
  if(state==='ready'){
    gx.fillStyle='rgba(10,15,40,.35)';gx.fillRect(0,40,W,100);
    txt('INFINITE',W/2,44,3,'#fff','c');txt('STAIRS',W/2,62,3,'#ffd84a','c');
    const dn=(performance.now()%2000)/500;drawChar(SK[selSkin],W/2,96,false,dn<1?1-dn:0);   // 선택한 스킨 모션 미리보기
    txt('<',16,102,1,'#fff');txt(SK[selSkin].n,W/2,102,1,'#ffd84a','c');txt('>',100,102,1,'#fff');
    txt('<',16,114,1,'#fff');txt('BG '+TH[selBg].n,W/2,114,1,'#9fe8ff','c');txt('>',100,114,1,'#fff');
    if(bl)txt(custom()?'PRESS YOUR KEY':'PRESS ANY KEY',W/2,127,1,'#fff','c');
    const nx=SK.find(s=>s.u>best);
    if(nx)txt('NEXT SKIN '+nx.n+' '+nx.u+'F',W/2,136,1,'#8fa0c0','c');
    sbtn(4,3,28,10,'KEYS',false);sbtn(88,3,28,10,'SOUND',false);
  }
  if(state==='over'){
    gx.fillStyle='rgba(10,15,40,.72)';gx.fillRect(0,0,W,H);
    txt('GAME OVER',W/2,50,2,'#ff5a6e','c');
    txt('FLOOR',W/2,80,1,'#cfe0ff','c');txt(floor,W/2,90,3,'#fff','c');
    txt('BEST '+best,W/2,112,1,'#ffd84a','c');
    if(newSkin)txt('NEW SKIN '+newSkin,W/2,122,1,'#9fe8ff','c');
    if(bl)txt('PRESS ANY KEY',W/2,134,1,'#fff','c');
  }
  if(state==='keys')drawKeys();
  if(state==='sound')drawSound();
  gx.restore();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(g,0,0,480,720);
}
function loop(t){const dt=Math.min(0.05,(t-last)/1000||0.016);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
