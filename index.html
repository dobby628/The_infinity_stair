const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const W=120,H=180,DX=16,DY=9,PI=Math.PI;

try{best=+localStorage.getItem('stairs_best_pixel')||0;const s=JSON.parse(localStorage.getItem('stairs_pixel_sel')||'[0,0]');selSkin=s[0]|0;selBg=s[1]|0;}catch(e){}
const saveSel=()=>{try{localStorage.setItem('stairs_pixel_sel',JSON.stringify([selSkin,selBg]))}catch(e){}};

/* ---------- 3x5 픽셀 폰트 ---------- */
const F={A:'010/101/111/101/101',B:'110/101/110/101/110',C:'011/100/100/100/011',D:'110/101/101/101/110',E:'111/100/110/100/111',F:'111/100/110/100/100',G:'011/100/101/101/011',H:'101/101/111/101/101',I:'111/010/010/010/111',J:'001/001/001/101/010',K:'101/101/110/101/101',L:'100/100/100/100/111',M:'101/111/111/101/101',N:'110/101/101/101/101',O:'010/101/101/101/010',P:'110/101/110/100/100',R:'110/101/110/101/101',S:'011/100/010/001/110',T:'111/010/010/010/010',U:'101/101/101/101/111',V:'101/101/101/101/010',W:'101/101/111/111/101',X:'101/101/010/101/101',Y:'101/101/010/010/010',Z:'111/001/010/100/111',
'0':'111/101/101/101/111','1':'010/110/010/010/111','2':'111/001/111/100/111','3':'111/001/111/001/111','4':'101/101/111/001/001','5':'111/100/111/001/111','6':'111/100/111/101/111','7':'111/001/001/010/010','8':'111/101/111/101/111','9':'111/101/111/001/111','-':'000/000/111/000/000',':':'000/010/000/010/000','<':'001/010/100/010/001','+':'000/010/111/010/000','Q':'010/101/101/111/011','/':'001/001/010/100/100','.':'000/000/000/000/010','!':'010/010/010/000/010','>':'100/010/001/010/100'};
function txt(s,x,y,sc,col,al){
  s=String(s).toUpperCase();const w=s.length*4*sc-sc;
  const px0=al==='c'?x-Math.floor(w/2):al==='r'?x-w:x;
  for(const [ox,oy,c] of [[1,1,'rgba(0,0,0,.5)'],[0,0,col]]){
    gx.fillStyle=c;let px=px0;
    for(const ch of s){
      const gl=F[ch];
      if(gl){const rows=gl.split('/');for(let r=0;r<5;r++)for(let c2=0;c2<3;c2++)if(rows[r][c2]==='1')gx.fillRect(px+c2*sc+ox,y+r*sc+oy,sc,sc);}
      px+=4*sc;
    }
  }
}

/* ---------- 캐릭터: 24x32 하프유닛 도트 (게임 1유닛 = 2칸), 자동 외곽선, 부위별 애니메이션 ---------- */
function rgbOf(c){
  if(c[0]==='#'){let h=c.slice(1);if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
  const m=c.match(/\d+/g);return [+m[0],+m[1],+m[2]];
}
const tint=(c,k)=>'rgb('+rgbOf(c).map(v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))))).join(',')+')';
const GW=24,GH=40,GO=8;     // 격자 폭/높이, 머리 위쪽 여백 행(GO)
const SK=[
 {n:'BASIC',u:0,pal:{h:'#4a2c1a',s:'#ffd2a8',o:'#ff7a1a',O:'#c85a0a',p:'#2b3a55',b:'#14141f',e:'#111'},acc:[],dust:'#ffd9a0',puff:5},
 {n:'MAEHWA',u:0,pal:{h:'#15121c',s:'#ffe0c8',o:'#f4f1ea',O:'#b9b2cc',p:'#1f2a52',b:'#14141f',e:'#111'},sash:'#e0507a',
  fx:'sword',blade:'#e8eef8',hilt:'#8a5a2a',trail:[255,190,215],petals:1,pony:1,dust:'#f6a6bd',puff:7,
  acc:[[11,-3,5,3,'#15121c'],[12,-4,3,1,'#2a2438'],[16,-2,2,3,'#e0507a',1],[17,-1,2,1,'#f08aa6',1],
       [10,13,1,1,'#f08aa6'],[11,14,1,1,'#f6a6bd'],[15,15,1,1,'#f08aa6'],[13,20,1,1,'#f6a6bd'],[10,21,1,1,'#f08aa6']],
  back:[[4,5,3,3,'#6b4a2a'],[3,8,5,1,'#c9a227'],[4,9,3,15,'#3b2b1a'],[5,24,1,1,'#c9a227']]},
 {n:'NINJA',u:30,pal:{h:'#34344c',s:'#3a3a52',o:'#3a3a54',O:'#26263c',p:'#2c2c44',b:'#16161f',e:'#fff'},fx:'ghost',dust:'#e8e8f0',puff:10,
  acc:[[8,3,11,1,'#e03a3a'],[15,6,2,2,'#fff'],[16,6,1,2,'#111'],[10,10,8,2,'#e03a3a'],[7,11,4,1,'#e03a3a',1],[4,12,4,1,'#e03a3a',2],[2,13,3,1,'#c02a2a',3]]},
 {n:'KNIGHT',u:60,pal:{h:'#8d99ad',s:'#ffd2a8',o:'#b8c4d4',O:'#7e8aa0',p:'#59657a',b:'#2b3140',e:'#111'},sash:'#c9a227',
  fx:'sword',blade:'#dfe6f2',hilt:'#c9a227',trail:[220,230,255],heavy:1,dust:'#ffb02a',puff:8,
  acc:[[8,0,11,5,'#8d99ad'],[10,1,4,1,'#c6d0e0'],[14,5,5,1,'#222'],[12,-4,3,4,'#e03a3a',1],[11,-3,1,3,'#e03a3a',1],[15,-3,1,2,'#c02a2a',1],
       [7,11,4,3,'#c6d0e0'],[16,11,4,3,'#c6d0e0'],[12,14,3,2,'#c9a227']]},
 {n:'GOLD',u:100,pal:{h:'#a8741a',s:'#ffe0a0',o:'#ffd84a',O:'#d9a520',p:'#8a5a14',b:'#5a3a0a',e:'#111'},fx:'spark',glint:1,dust:'#fff2a0',puff:9,
  acc:[[9,-2,9,3,'#ffd84a'],[9,-4,2,2,'#ffd84a'],[13,-4,2,2,'#ffd84a'],[16,-4,2,2,'#ffd84a'],[13,-1,1,1,'#ff3b5c'],[9,0,9,1,'#d9a520']]},
 {n:'WANDERER',u:15,pal:{h:'#15121c',s:'#ffe0c8',o:'#2a3a5c',O:'#1c2840',p:'#5a4a3a',b:'#2a1f14',e:'#111'},sash:'#b8493a',
  fx:'sword',blade:'#cfd6e4',hilt:'#6b4a2a',trail:[200,210,230],dust:'#d9c9a0',puff:6,
  acc:[[12,-5,3,1,'#d9b774'],[10,-4,7,1,'#d9b774'],[8,-3,11,1,'#d9b774'],[6,-2,15,1,'#d9b774'],[4,-1,19,2,'#c49a55'],[4,1,19,1,'#a87a3a']],
  back:[[4,5,3,3,'#6b4a2a'],[3,8,5,1,'#c9a227'],[4,9,3,15,'#3b2b1a'],[5,24,1,1,'#c9a227']]},
 {n:'CAT',u:45,pal:{h:'#e8892f',s:'#f6c27a',o:'#e8892f',O:'#c4691a',p:'#e8892f',b:'#fff1d6',e:'#111'},dust:'#fff1d6',puff:5,
  acc:[[8,-2,3,4,'#e8892f'],[16,-2,3,4,'#e8892f'],[9,-1,1,2,'#ff8aa0'],[17,-1,1,2,'#ff8aa0'],[11,1,1,2,'#c4691a'],[13,1,1,2,'#c4691a'],
       [4,22,2,6,'#e8892f',1],[3,18,2,5,'#e8892f',2],[2,15,2,4,'#c4691a',3],[18,8,1,1,'#ff8aa0'],[19,8,3,1,'#ffffff'],[19,10,3,1,'#ffffff']]},
 {n:'WIZARD',u:80,pal:{h:'#d8d8e8',s:'#ffe0c8',o:'#6a3ab8',O:'#4a2380',p:'#3a2a5a',b:'#1a1030',e:'#111'},sash:'#ffd84a',fx:'spark',spark:'#c9a0ff',circle:1,dust:'#c9a0ff',puff:8,
  acc:[[12,-9,2,2,'#5a2e9a'],[11,-7,4,2,'#5a2e9a'],[10,-5,6,2,'#5a2e9a'],[9,-3,8,2,'#5a2e9a'],[8,-1,10,1,'#5a2e9a'],[4,0,19,2,'#4a2380'],[12,-4,2,2,'#ffd84a'],
       [14,9,4,5,'#eeeeee'],[15,14,2,2,'#eeeeee']]},
 {n:'ROBOT',u:130,pal:{h:'#7d8aa8',s:'#b8c4d4',o:'#8896b4',O:'#5a6684',p:'#4a5570',b:'#2b3140',e:'#ff3b5c'},sash:'#5a6684',fx:'spark',spark:'#7dfcff',jet:1,dust:'#7dfcff',puff:8,
  acc:[[13,-5,1,5,'#5a6684'],[12,-7,3,2,'#ff3b5c'],[9,4,10,5,'#10152a'],[15,6,3,1,'#ff3b5c'],[16,7,1,1,'#ff7a8a'],
       [12,14,3,3,'#7dfcff'],[12,14,3,1,'#bff8ff'],[9,12,1,1,'#c0cada'],[17,12,1,1,'#c0cada']]}
];
const unlocked=i=>best>=SK[i].u;
/* 한 걸음의 포즈: an(1→0) 진행도 → 도약 높이, 앞다리 들기, 상체 기울임, 착지 웅크림, 숨쉬기, 펄럭임 */
function pose(an,t,dead){
  const p=an>0?1-an:1,sw=an>0?Math.sin(p*PI):0,land=an>0&&p>0.7?(p-0.7)/0.3:0,idle=an>0?0:Math.sin(t/360);
  const by=Math.round(land*2)+((!dead&&idle>0.55)?1:0),lean=Math.round(sw*2);
  return {p,sw,land,idle,by,lean,dT:Math.round(lean/2),lift:Math.round(sw*8),fw:Math.round(sw*4),flow:Math.sin(t/130)*0.9+sw*2.2};
}
const swordAng=(an,par,big)=>{const p=1-an,e=p*p*(3-2*p);return ((par?50:-130)+(par?-1:1)*(big?360:180)*e)*PI/180;};   // 오르기마다 위/아래 번갈아 베기, 10층마다 360도 회전베기
function paint(sk,an,o){
  o=o||{};const t=o.t||0,par=o.par|0,dead=!!o.dead;
  const P=sk.pal,g=Array.from({length:GH},()=>new Array(GW).fill(null));
  const R=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){const xx=Math.floor(x)+i,yy=Math.floor(y)+j+GO;if(xx>=0&&xx<GW&&yy>=0&&yy<GH)g[yy][xx]=c;}};
  const L=(x0,y0,x1,y1,c,w)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1)*2;for(let i=0;i<=n;i++)R(x0+(x1-x0)*i/n-(w>>1),y0+(y1-y0)*i/n-(w>>1),w,w,c);};
  const K=pose(an,t,dead),{sw,land,idle,by,lean,dT,lift,fw,flow}=K;
  const skin=P.s,skinD=tint(P.s,-0.12),robeL=tint(P.o,0.2),robeD=P.O,pantsD=tint(P.p,-0.22),bootD=tint(P.b,-0.1);
  const leg=(hx,kx,ky,fx,fy,c,boot)=>{L(hx,22+by,kx,ky,c,3);L(kx,ky,fx,fy,c,3);R(fx-2,fy,6,2,boot);R(fx+1,fy,1,1,tint(boot,0.3));};
  const plant=(hx,fx,dk)=>leg(hx,(hx+fx)/2+dk*Math.round(land*2),((22+by+30)/2)|0,fx,30,pantsD,bootD);
  const raise=(hx,fx0,tg)=>{const fx=fx0+tg,fy=30-lift;leg(hx,(hx+fx)/2+2,(((22+by+fy)/2)|0)-1,fx,fy,P.p,P.b);};
  if(sk.back)for(const a of sk.back)R(a[0]-lean,a[1]+by,a[2],a[3],a[4]);                               // 등에 멘 물건
  if(sk.pony)for(let k=0;k<4;k++)R(7-k*2+lean-Math.round(flow*k/2),6+k+by,3,2,P.h);                   // 휘날리는 머리카락
  L(10+dT,12+by,8-Math.round(sw*2)+dT,19-Math.round(sw)+by,robeD,2);R(7-Math.round(sw*2)+dT,19-Math.round(sw)+by,2,2,skinD);   // 뒤쪽 팔
  if(par===0)plant(11,10,-1);else plant(15,17,1);                                                      // 지지하는 다리
  R(9+dT,11+by,9,11-by,P.o);R(10+dT,11+by,1,10-by,robeL);R(17+dT,11+by,1,11-by,robeD);                // 몸통
  R(8+dT,20,11,3,P.o);R(8+dT,20,1,3,robeD);R(18+dT,20,1,3,robeD);R(9+dT,22,9,1,robeD);                // 도포 자락
  R(9+dT,17+by,9,2,sk.sash||robeD);R(12+dT,11+by,3,1,skin);R(13+dT,12+by,1,1,skin);
  if(par===0)raise(15,17,fw+1);else raise(11,10,Math.round(sw*7));                                     // 번갈아 앞으로 내딛는 다리
  const cx=13,cy=5.5,rx=4.8,ry=5,hx0=lean,hy0=by;                                                     // 머리
  for(let y=0;y<=10;y++){const d=(y+0.5-cy)/ry;if(Math.abs(d)>1)continue;const w=Math.round(rx*Math.sqrt(1-d*d));R(cx-w+hx0,y+hy0,w*2+1,1,y>=9?skinD:skin);}
  for(let y=0;y<=3;y++){const d=(y+0.5-cy)/ry,w=Math.round(rx*Math.sqrt(1-d*d));R(cx-w+hx0,y+hy0,w*2+1,1,P.h);}
  R(8+hx0,4+hy0,7,1,P.h);R(8+hx0,5+hy0,3,1,P.h);R(8+hx0,6+hy0,3,5,P.h);R(9+hx0,10+hy0,2,2,P.h);R(10+hx0,2+hy0,5,1,tint(P.h,0.2));
  if(dead){[[14,6],[16,6],[15,7],[14,8],[16,8]].forEach(([x,y])=>R(x+hx0,y+hy0,1,1,'#111'));}          // 죽으면 X 눈
  else if((t%3200)<110)R(15+hx0,7+hy0,2,1,P.e);                                                         // 깜빡임
  else{R(15+hx0,6+hy0,2,2,P.e);R(15+hx0,6+hy0,1,1,'#ffffff');}
  R(14+hx0,8+hy0,1,1,tint(P.s,-0.06));
  if(sw>0.45||dead)R(16+hx0,9+hy0,2,2,'#5a1a1a');else R(16+hx0,9+hy0,2,1,tint(P.s,-0.32));              // 도약할 땐 기합(입 벌림)
  let ax=17+Math.round(sw*4),ay=19-Math.round(sw*6)+by+(an>0||dead?0:(idle>0.55?1:0));                  // 앞쪽 팔: 주먹 쥐고 위로 뻗기
  if(sk.fx==='sword'&&an>0){const a=swordAng(an,par,o.big);ax=16+Math.round(Math.cos(a)*5);ay=12+by+Math.round(Math.sin(a)*5);}
  L(16+dT,12+by,ax+dT,ay,P.o,2);R(ax+dT-1,ay,2,2,skin);
  if(sk.acc)for(const a of sk.acc){const dx=a[1]<11?lean:dT;R(a[0]+dx-Math.round((a[5]||0)*flow),a[1]+by,a[2],a[3],a[4]);}
  if(sk.glint&&an>0){const d=Math.floor(K.p*34)-6;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(g[j][i]&&(i+j===d||i+j===d+1))g[j][i]='#fff8d0';}   // 금빛 반짝 스윕
  return g;
}
/* 격자를 하프유닛 픽셀로 그리고 자동 외곽선을 둘러준다. wx는 가로 압축(방향 전환 연출용) */
function gridDraw(g,x,y,flip,alpha,wx){
  const x0=Math.round((x-6)*2)/2,y0=Math.round((y-20)*2)/2,OUT='#14121f',sx=wx||1;
  if(alpha!=null)gx.globalAlpha=alpha;
  const cell=(i,j)=>{const c=g[j][i];if(c)return c;return ((j>0&&g[j-1][i])||(j<GH-1&&g[j+1][i])||(i>0&&g[j][i-1])||(i<GW-1&&g[j][i+1]))?OUT:null;};
  for(let j=0;j<GH;j++){
    let i=0;
    while(i<GW){
      const c=cell(i,j);
      if(!c){i++;continue;}
      let k=i+1;while(k<GW&&cell(k,j)===c)k++;
      const a=i,b=k-1,left=flip?x0+(GW-1-b)*0.5:x0+a*0.5,w=(b-a+1)*0.5;
      gx.fillStyle=c;gx.fillRect(x+(left-x)*sx,y0+j*0.5,w*sx,0.5);
      i=k;
    }
  }
  gx.globalAlpha=1;
}
/* 스킨 전용 연출 (하프유닛 해상도). ph0=캐릭터 뒤(링/잔상/마법진/분사), ph1=앞(검기/반짝임) */
function skinFx(sk,x,y,flip,an,ph,o,gy){
  const dir=flip?-1:1,x0=Math.round((x-6)*2)/2,y0=Math.round((y-20)*2)/2,par=o.par|0,big=!!o.big;
  const hp=(px,py,c)=>{gx.fillStyle=c;gx.fillRect(Math.floor(px*2)/2,Math.floor(py*2)/2,0.5,0.5);};
  if(ph===0){
    if(an>0&&an<0.4){                                           // 착지 충격파
      const r=2+(0.4-an)/0.4*(sk.heavy?11:7);gx.globalAlpha=an/0.4*0.6;
      for(let a=0;a<6.28;a+=0.16)hp(x+Math.cos(a)*r*1.6,gy+Math.sin(a)*r*0.35,sk.dust||'#ffffff');
      gx.globalAlpha=1;
    }
    if(an>0&&sk.circle){                                        // 마법진
      gx.globalAlpha=Math.min(1,an*1.6);
      for(let a=0;a<6.28;a+=0.22)hp(x+Math.cos(a+an*7)*8,gy+Math.sin(a+an*7)*2.2,'#c9a0ff');
      for(let a=0;a<6.28;a+=0.4)hp(x+Math.cos(a-an*5)*5,gy+Math.sin(a-an*5)*1.4,'#ffffff');
      gx.globalAlpha=1;
    }
    if(an>0.45&&sk.jet){                                        // 로봇 제트 분사
      const len=(an-0.4)*9;
      for(let i=0;i<len;i+=0.5){gx.globalAlpha=1-i/len;hp(x-0.5,y+i,i<len*0.35?'#fff6a0':i<len*0.7?'#ffb02a':'#ff5a2a');hp(x,y+i,i<len*0.5?'#fff6a0':'#ffb02a');}
      gx.globalAlpha=1;
    }
    if(sk.fx==='ghost'&&an>0){                                  // 닌자 잔상 (길게 3개)
      const g2=paint(sk,0.55,{par,t:o.t});
      for(let k=1;k<=3;k++)gridDraw(g2,x-dir*k*2.4,y+k*0.7,flip,0.32/k);
    }
    return;
  }
  const dz=!!o.dead;
  if(dz){for(let k=0;k<3;k++){const a=o.t/160+k*2.1;hp(x+Math.cos(a)*6,y-23+Math.sin(a)*1.6,'#ffd84a');hp(x+Math.cos(a)*6+0.5,y-23+Math.sin(a)*1.6,'#fff6a0');}return;}   // 기절 별
  if(an<=0)return;
  if(sk.fx==='sword'){
    const K=pose(an,o.t,false),ang=swordAng(an,par,big),sg=par?-1:1,span=big?30:14;
    const hc=(16+K.dT+Math.round(Math.cos(ang)*5)),hr=(12+K.by+Math.round(Math.sin(ang)*5));
    const hx=x0+(flip?GW-1-hc:hc)*0.5+0.25,hy=y0+(hr+GO)*0.5+0.25;
    const ca=Math.cos(ang)*dir,sa=Math.sin(ang),tc='rgb('+sk.trail.join(',')+')';
    for(let k=1;k<=span;k++){                                   // 베기 궤적: 색 잔상 + 흰 심지
      const aa=ang-sg*k*0.085*(big?1.15:1),cc=Math.cos(aa)*dir,ss=Math.sin(aa);
      gx.globalAlpha=(1-k/(span+1))*0.7;
      for(let r=big?6:7;r<=(big?15:13);r+=0.5)hp(hx+cc*r,hy+ss*r,tc);

function drawChar(sk,x,y,flip,an,o){

  if(turn>0){wx=Math.max(0.18,Math.abs(Math.cos(PI*prog)));fl=prog<0.5?!flip:flip;hop=Math.sin(PI*prog)*1.5;}
  const jump=an>0?Math.sin(Math.min(1,(1-an)*1.25)*PI)*3.2:0,yy=y-jump-hop,dir=fl?-1:1;
  const g=paint(sk,an,o);

function gen(i){const p=dirs[i-1];let run=0;for(let j=i-1;j>=2&&dirs[j]!==dirs[j-1]&&run<3;j--)run++;const pf=run===0?0.28:run===1?0.2:run===2?0.1:0;dirs[i]=Math.random()<pf?-p:p;xs[i]=xs[i-1]+dirs[i]*DX;}

  if(!ac){

      musicGain=ac.createGain();musicGain.gain.value=vm;musicGain.connect(master);
      sfxGain=ac.createGain();sfxGain.gain.value=vs;sfxGain.connect(master);

function tone(f,t,d,type,v,dest,sl){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.02);
}

const mf=m=>440*Math.pow(2,(m-69)/12);

const MAJ=[0,2,4,5,7,9,11];

function dm(tr,d,oct){const L=tr.sc.length,o=Math.floor(d/L),i=((d%L)+L)%L;return tr.root+tr.sc[i]+12*o+oct;}
function playStep(tr,s,t,sl){
  const L=tr.sc.length,l=tr.lead[s];
  if(l>=0)tone(mf(dm(tr,l,0)),t,sl*tr.len,tr.wave,tr.lv,musicGain);
  const r=tr.chords[Math.floor(s/8)%tr.chords.length];
  tone(mf(dm(tr,s%2===0?r:r+L,-24)),t,sl*0.9,'triangle',0.15,musicGain);            // 옥타브 바운스 베이스
  if(tr.stab&&s%4===3)for(const k of [0,2,4])tone(mf(dm(tr,r+k,-12)),t,sl*0.5,'square',0.014,musicGain);
  const m=s%8;
  if(m===0||m===4)tone(150,t,0.12,'sine',0.22,musicGain,40);                         // 킥
  if(m===2||m===6)nz(t,0.09,0.08,1800);                                              // 스네어

function bands(cols){                       // 24단 그라데이션 + 경계 체커 디더링 (색이 바뀔 때만 다시 그려서 캐시)

    const at=t=>{const f=t*(cs.length-1),i=Math.min(cs.length-2,Math.floor(f)),u=f-i,a=cs[i],b=cs[i+1];return a.map((v,k)=>Math.round(v+(b[k]-v)*u));};
    let prev=null;

function mount(base,amp,f1,f2,seed,col,par){     // 산: 하프유닛 능선 + 빛 받는 면/그늘 면
  const by=base+Math.round(camY*par);
  const hf=x=>Math.round(amp*2*(0.55+0.3*Math.sin(x*f1+seed)+0.15*Math.sin(x*f2+seed*1.7)))/2;
  const lit=tint(col,0.16),sh=tint(col,-0.16);
  for(let x=0;x<W;x+=0.5){
    const top=by-hf(x);if(top>=H)continue;
    gx.fillStyle=col;gx.fillRect(x,top,0.5,H-top);
    const sl=hf(x+0.5)-hf(x);
    gx.fillStyle=sl>0.4?lit:sl<-0.4?sh:col;gx.fillRect(x,top,0.5,Math.min(4,H-top));
    gx.fillStyle=lit;gx.fillRect(x,top,0.5,0.5);
  }
  return x=>by-hf(x);
}

  if(fall){px=W/2+fall.x-camX;py+=fall.y;}
  if(state!=='ready'){
    if(!fall){gx.fillStyle='rgba(0,0,0,.25)';gx.fillRect(Math.round(px)-4,Math.round(py),8,1);}
    const flip=fall?(Math.floor(fall.t*12)%2===0?facing===-1:facing===1):facing===-1;
    drawChar(sk,px,py,flip,fall?0:anim,{par:floor%2,big:floor>0&&floor%10===0&&anim>0,dead:!!fall,turn:fall?0:turnAnim,t:performance.now()});
  }
  const dc0=th.dust||(th.petal?'#f6a6bd':'#efe6cc');
  for(const p of parts){gx.globalAlpha=Math.min(1,p.l*3);gx.fillStyle=p.c||dc0;gx.fillRect(Math.round(p.x*2)/2,Math.round(p.y*2)/2,p.s||1,p.s||1);}
  gx.globalAlpha=1;

  // HUD
  txt(floor,W/2,4,3,'#fff','c');
  txt('FLOOR '+floor+'  BEST '+best,W/2,22,1,'#fff','c');
  gx.fillStyle='#14203f';gx.fillRect(9,29,102,8);
  gx.fillStyle='#2b3a55';gx.fillRect(10,30,100,6);
  const low=gauge<0.25,blink=Math.floor(performance.now()/150)%2===0;
  gx.fillStyle=low&&blink?'#ff8a9a':low?'#ff3b5c':'#4cd964';
  gx.fillRect(10,30,Math.round(100*gauge),6);
  gx.fillStyle='rgba(255,255,255,.35)';gx.fillRect(10,30,Math.round(100*gauge),1);
  btn(4,146,54,30,'TURN',KM.turn.length?KM.turn.slice(0,3).map(lab).join(' '):'LEFT KEY',pressA);
  btn(62,146,54,30,'CLIMB',KM.climb.length?KM.climb.slice(0,3).map(lab).join(' '):'RIGHT KEY',pressB);

  const bl=Math.floor(performance.now()/450)%2===0;
  if(state==='ready'){
    gx.fillStyle='rgba(10,15,40,.5)';gx.fillRect(0,40,W,100);
    txt('INFINITE',W/2,44,3,'#fff','c');txt('STAIRS',W/2,62,3,'#ffd84a','c');
    const nw=performance.now(),cy0=Math.floor(nw/2000),dn=(nw%2000)/380;drawChar(SK[selSkin],W/2,96,false,dn<1?1-dn:0,{par:cy0%2,big:cy0%3===2,t:nw});   // 선택한 스킨 모션 미리보기 (10층마다 나오는 회전베기까지 보여줌)
    txt('<',16,102,1,'#fff');txt(SK[selSkin].n,W/2,102,1,'#ffd84a','c');txt('>',100,102,1,'#fff');
    txt('<',16,114,1,'#fff');txt('BG '+TH[selBg].n,W/2,114,1,'#9fe8ff','c');txt('>',100,114,1,'#fff');
    if(bl)txt(custom()?'PRESS YOUR KEY':'PRESS ANY KEY',W/2,127,1,'#fff','c');
    const nx=SK.filter(s=>s.u>best).sort((a,b)=>a.u-b.u)[0];
    if(nx)txt('NEXT SKIN '+nx.n+' '+nx.u+'F',W/2,136,1,'#8fa0c0','c');
    sbtn(4,3,28,10,'KEYS',false);sbtn(88,3,28,10,'SOUND',false);sbtn(90,15,26,10,'DATA',false);
  }
  if(state==='over'){
    gx.fillStyle='rgba(10,15,40,.72)';gx.fillRect(0,0,W,H);
    txt('GAME OVER',W/2,50,2,'#ff5a6e','c');
    txt('FLOOR',W/2,80,1,'#cfe0ff','c');txt(floor,W/2,90,3,'#fff','c');
    txt('BEST '+best,W/2,112,1,'#ffd84a','c');
    if(newSkin)txt('NEW SKIN '+newSkin,W/2,129,1,'#ffd84a','c');
    if(bl)txt('PRESS ANY KEY',W/2,141,1,'#fff','c');
  }
  if(state==='keys')drawKeys();
  if(state==='sound')drawSound();
  if(state==='data')drawData();
  gx.restore();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(g,0,0,480,720);
}
function loop(t){const dt=Math.min(0.05,(t-last)/1000||0.016);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
