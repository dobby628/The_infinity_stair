function txt(s,x,y,sc,col,al){

    gx.fillText(s, x+1, y+1);

    gx.fillText(s, x, y);
    return;
  }
  
  s=s.toUpperCase();const w=s.length*4*sc-sc;

}

/* 한 걸음의 포즈: an(1→0) 진행도 → 도약 높이, 앞다리 들기, 상체 기울임, 착지 웅크림, 숨쉬기, 펄럭임 */

  const p=an>0?1-an:1,sw=an>0?Math.sin(p*PI):0,land=an>0&&p>0.7?(p-0.7)/0.3:0,idle=an>0?0:Math.sin(t/360);

const swordAng=(an,par,big)=>{const p=1-an,e=p*p*(3-2*p);return ((par?50:-130)+(par?-1:1)*(big?360:180)*e)*PI/180;};

  const leg=(hx,kx,ky,fx,fy,c,boot)=>{L(hx,22+by,kx,ky,c,3);L(kx,ky,fx,fy,c,3);R(fx-2,fy,6,2,boot);R(fx+1,fy,1,1,tint(boot,0.3));};

  R(9+dT,17+by,9,2,sk.sash||robeD);R(12+dT,11+by,3,1,skin);R(13+dT,12+by,1,1,skin);

const TC=new Map(),sh=(c,k)=>{const q=c+k;let v=TC.get(q);if(!v){v=tint(c,k);TC.set(q,v);}return v;};
function epx(g){const R=g.length,C=g[0].length,o=Array.from({length:R*2},()=>new Array(C*2).fill(null)),at=(i,j)=>(i<0||j<0||i>=C||j>=R)?null:g[j][i];
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){const P=g[j][i],A=at(i,j-1),B=at(i+1,j),E=at(i-1,j),D=at(i,j+1);let a=P,b=P,c=P,d=P;
    if(E===A&&E!==D&&A!==B)a=A;if(A===B&&A!==E&&B!==D)b=B;if(D===E&&D!==B&&E!==A)c=E;if(B===D&&B!==A&&D!==E)d=D;

function gridDraw(g,x,y,flip,alpha,wx){
  const FN=FINE;if(FN)g=epx(g);const R=g.length,C=g[0].length,S=inFx?1:CSC,Q=(FN?0.25:0.5)*S,x0=x-6*S,y0=y-20*S,OUT='#14121f',sx=wx||1,E=v=>Math.round(v*4)/4;
  if(alpha!=null)gx.globalAlpha=alpha;
  const cell=(i,j)=>{const c=g[j][i];if(c){const up=j<(FN?2:1)||!g[j-1][i]||(FN&&!g[j-2][i]),dn=j>R-(FN?3:2)||!g[j+1][i]||(FN&&!g[j+2][i]);return up?sh(c,0.22):dn?sh(c,-0.2):c;}return ((j>0&&g[j-1][i])||(j<R-1&&g[j+1][i])||(i>0&&g[j][i-1])||(i<C-1&&g[j][i+1]))?OUT:null;};
  for(let j=0;j<R;j++){

function skinFx(sk,x,y,flip,an,ph,o,gy){

/* ---------- 입력 ---------- */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey)return;e.preventDefault();if(e.repeat)return;
  ensureAudio();
  
  if(state==='revive_prompt'){
    if(e.code==='Space'){
      revUsed=true;
      state='play';
      fall=null;
      anim=0;
      dispF=floor;
      dispX=xs[floor];
      camX=dispX;
      camY=floor*DY;
      gauge=1;
      revive();
    }else if(e.code==='Enter'){
      revUsed=true;
      finalizeDeath();
    }
    return;
  }
  
  if(state==='keys'){keyAssign(e.code);return;}
  if(state==='sound'||state==='data'){if(e.code==='Escape'||e.code==='Enter')state='ready';return;}
  if(state==='over'){if(performance.now()-overAt>300)reset();return;}
  const a=actionFor(e.code);
  if(a)act(a==='turn');
},true);
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  ensureAudio();
  
  if(state==='revive_prompt') {
      if(y >= H/2 + 6 && y <= H/2 + 20) {
          if(x >= W/2 - 35 && x <= W/2 - 5) { // YES 버튼
              revUsed = true;
              state = 'play';
              fall = null;
              anim = 0;
              dispF = floor;
              dispX = xs[floor];
              camX = dispX;
              camY = floor * DY;
              gauge = 1;
              revive();
          } else if(x >= W/2 + 5 && x <= W/2 + 35) { // NO 버튼
              revUsed = true;
              finalizeDeath();
          }
      }
      return;
  }
  
  if(state==='keys'){
    for(const [id,bx,by,bw,bh] of KB)if(x>=bx&&x<bx+bw&&y>=by&&y<by+bh){
      if(id==='turn'||id==='climb')keyTarget=keyTarget===id?null:id;
      else if(id==='reset'){KM={turn:[],climb:[]};keyTarget=null;saveKM();}
      else{if(!custom()||(KM.turn.length&&KM.climb.length)){keyTarget=null;state='ready';}else keyWarn=1.5;}
    }
    return;
  }
  if(state==='data'){dataClick(x,y);return;}
  if(state==='sound'){
    if(x>=36&&x<84&&y>=140&&y<154){state='ready';return;}
    const i=sliderAt(y);if(i>=0){drag=i;setSlider(i,x);if(i===1)sfxStep();}
    return;
  }
  if(state==='over'){if(performance.now()-overAt>300)reset();return;}
  if(state==='ready'){
    if(y<14){
      if(x<32){keyTarget=null;state='keys';}
      else if(x>88){state='sound';}
      return;
    }
    if(y<27&&x>88){dataMsg='';state='data';return;}
    if(y>=98&&y<122){
      const d=x<W/2?-1:1;
      if(y<110){let i=selSkin;do{i=(i+d+SK.length)%SK.length;}while(!unlocked(i));selSkin=i;}
      else selBg=(selBg+d+TH.length)%TH.length;
      saveSel();return;
    }
  }
  act(x<W/2);
});

/* ---------- 업데이트 ---------- */
function update(dt){
  if(ac)applyVol();
  keyWarn=Math.max(0,keyWarn-dt);
  revT=Math.max(0,revT-dt);revFlash=Math.max(0,revFlash-dt);
  
  // 게이지 바닥 시 자동 부활 없이 사망 처리
  if(state==='play'){if(revT<=0)gauge-=dt*gaugeRate();if(gauge<=0){gauge=0;die();}}
  
  dispX+=(xs[floor]-dispX)*Math.min(1,dt*22);dispF+=(floor-dispF)*Math.min(1,dt*22);
  camX+=(dispX-camX)*Math.min(1,dt*8);camY+=(dispF*DY-camY)*Math.min(1,dt*10);
  pressA=Math.max(0,pressA-dt*8);pressB=Math.max(0,pressB-dt*8);
  anim=Math.max(0,anim-dt*5.5);turnAnim=Math.max(0,turnAnim-dt*9);shake=Math.max(0,shake-dt*14);
  if(fall){fall.vy+=330*dt;fall.y+=fall.vy*dt;fall.x+=fall.vx*dt;fall.t+=dt;}
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;}
}

const lerp=(a,b,t)=>a+(b-a)*t;
const rgb=(c,d,t)=>`rgb(${lerp(c[0],d[0],t)|0},${lerp(c[1],d[1],t)|0},${lerp(c[2],d[2],t)|0})`;
let bandKey='',bandCv=null;
function bands(cols){
  const key=cols.join('|');
  if(key!==bandKey||!bandCv){
    bandKey=key;
    if(!bandCv){bandCv=document.createElement('canvas');bandCv.width=480;bandCv.height=720;}
    const bx=bandCv.getContext('2d');bx.setTransform(4,0,0,4,0,0);
    const cs=cols.map(rgbOf),N=24,bh=H/N;
    const at=t=>{const f=t*(cs.length-1),i=Math.min(cs.length-2,Math.floor(f)),u=f-i,a=cs[i],b=cs[i+1];return a.map((v,k)=>Math.round(v+(b[k]-v)*u));};
    let prev=null;
    for(let n=0;n<N;n++){
      const col='rgb('+at((n+0.5)/N).join(',')+')';
      bx.fillStyle=col;bx.fillRect(0,n*bh,W,bh+0.5);
      if(prev){bx.fillStyle=prev;for(let i=0;i<W*2;i+=2){bx.fillRect(i*0.5,n*bh,0.5,0.5);bx.fillRect((i+1)*0.5,n*bh+0.5,0.5,0.5);}}
      prev=col;
    }
  }
  gx.drawImage(bandCv,0,0,W,H);
}
const STARS=Array.from({length:36},(_,i)=>[(i*37+11)%W,(i*53+7)%150]);
const CLOUDS=[[10,20,1],[70,60,0.8],[40,100,1.2],[95,140,0.9],[20,170,1],[80,0,1.1]];
function clouds(col,a,par){
  const lo=tint(col,-0.12);
  for(const [cx,cy,sc] of CLOUDS){
    const y=Math.round(((cy+camY*par)%210+210)%210-15),x=Math.round(cx+Math.sin(performance.now()/4000+cy)*3);
    for(const [dx,dy,rx,ry] of [[0,0,7,2.5],[-5,1,5,2],[6,1,5,2],[1,-2,4,2]]){
      const X=x+dx*sc,Y=y+dy*sc,RX=rx*sc,RY=ry*sc;
      for(let yy=-RY;yy<=RY;yy+=0.5){
        const w=RX*Math.sqrt(1-(yy/RY)*(yy/RY));
        gx.globalAlpha=a;gx.fillStyle=yy>RY*0.35?lo:col;
        gx.fillRect(Math.round((X-w)*2)/2,Math.round((Y+yy)*2)/2,Math.round(w*4)/2,0.5);
      }
    }
  }
  gx.globalAlpha=1;
}
function fx(cols,vx,vy){

function mount(base,amp,f1,f2,seed,col,par){
  const by=base+Math.round(camY*par);
  const hf=x=>Math.round(amp*2*(0.55+0.3*Math.sin(x*f1+seed)+0.15*Math.sin(x*f2+seed*1.7)))/2;
  const lit=tint(col,0.16),sh=tint(col,-0.16);
  for(let x=0;x<W;x+=0.5){
    const top=by-hf(x);if(top>=H)continue;
    gx.fillStyle=col;gx.fillRect(x,top,0.5,H-top);
    const sl=hf(x+0.5)-hf(x);
    gx.fillStyle=sl>0.4?lit:sl<-0.4?sh:col;gx.fillRect(x,top,0.5,Math.min(4,H-top));
    gx.fillStyle=lit;gx.fillRect(x,top,0.5,0.5);
  }
  return x=>by-hf(x);
}

  for(let y=-13;y<=13;y++)for(let x=-13;x<=13;x++)if(x*x+y*y<=169){gx.fillStyle=(y+13)%5===0?'#a8704a':'#c58b5a';gx.fillRect(cx+x,cy+y,1,1);}

  for(let a=0;a<6.28;a+=0.1){const x=Math.round(Math.cos(a)*21),y=Math.round(Math.sin(a)*5);if(y>=0||Math.abs(x)>13)gx.fillRect(cx+x,cy+y,1,1);}
  const mx=98,my=Math.round(((120+camY*0.08)%260+260)%260-40);
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if(x*x+y*y<=36){gx.fillStyle='#9aa6c8';gx.fillRect(mx+x,my+y,1,1);}
  gx.fillStyle='#7f8bb0';gx.fillRect(mx-2,my-2,2,2);gx.fillRect(mx+2,my+2,1,1);
  fx(['#ffffff','#9fb4ff','#ffd8a0'],0,38);
}
const TH=[
 {n:'SKY',bg:bgSky,st:{o:'#3b2f1c',top:'#e6d8a8',ctop:'#fff6c0',mid:'#b39c6a',dark:'#7d6841',joint:'#977f52',num:'#3b2f1c'}},
 {n:'HWASAN',bg:bgHwa,petal:1,st:{o:'#2a2f38',top:'#d8d4ca',ctop:'#ffffff',mid:'#8e8a86',dark:'#5b5853',joint:'#706c67',num:'#2a2f38'}},
 {n:'SUNSET',bg:bgSun,st:{o:'#2a1630',top:'#f3c7a0',ctop:'#fff0c8',mid:'#c9807a',dark:'#7a3f5c',joint:'#a85d6a',num:'#2a1630'}},
 {n:'CYBER',bg:bgCyber,st:{o:'#00e5ff',top:'#1d6a86',ctop:'#7dfcff',mid:'#101a33',dark:'#0a1022',joint:'#16305a',num:'#7dfcff'}},
 {n:'BAMBOO',bg:bgBamboo,st:{o:'#3a2a14',top:'#e0c088',ctop:'#fff0c0',mid:'#b08a50',dark:'#6b5230',joint:'#8f6f3c',num:'#3a2a14'}},
 {n:'SNOW',bg:bgSnow,dust:'#ffffff',st:{o:'#2a3f5c',top:'#ffffff',ctop:'#e8f6ff',mid:'#a9c7e0',dark:'#6f8fb0',joint:'#8aa8c8',num:'#2a3f5c'}},
 {n:'SPACE',bg:bgSpace,dust:'#9fb4ff',st:{o:'#0a0d1a',top:'#8a93ad',ctop:'#d9e2ff',mid:'#4a5270',dark:'#2a3048',joint:'#3a4262',num:'#d9e2ff'}}];

/* ---------- 그리기 ---------- */
function stepBlock(x,y,cur,i,s,petal){
  const x0=x-7.5,tp=cur?s.ctop:s.top,n=(i*2654435761)>>>0,v=n%9;
  gx.fillStyle='rgba(0,0,0,.2)';gx.fillRect(x0+1,y+10,14,1.5);gx.fillStyle='rgba(0,0,0,.1)';gx.fillRect(x0+2,y+11.5,12,1);
  gx.fillStyle=s.o;gx.fillRect(x0-0.5,y-0.5,16,11);
  gx.fillStyle=tp;gx.fillRect(x0,y,15,3);
  gx.fillStyle=tint(tp,0.4);gx.fillRect(x0,y,15,0.5);gx.fillRect(x0,y,0.5,3);
  gx.fillStyle=tint(tp,-0.14);gx.fillRect(x0,y+2.5,15,0.5);gx.fillRect(x0+14.5,y,0.5,3);
  gx.fillStyle=tint(s.mid,0.14);gx.fillRect(x0,y+3,15,2);
  gx.fillStyle=s.mid;gx.fillRect(x0,y+5,15,3);
  gx.fillStyle=s.dark;gx.fillRect(x0,y+8,15,2);
  gx.fillStyle=s.joint;gx.fillRect(x0,y+5.5,15,0.5);
  const o=(i&1)?3:0;gx.fillRect(x0+5+o,y+3,0.5,2.5);gx.fillRect(x0+11-o,y+3,0.5,2.5);gx.fillRect(x0+8,y+6,0.5,2);
  gx.fillStyle=tint(s.mid,0.25);gx.fillRect(x0,y+3,0.5,5);
  gx.fillStyle=tint(s.dark,-0.3);gx.fillRect(x0+14.5,y+3,0.5,7);gx.fillRect(x0,y+9.5,15,0.5);
  gx.fillStyle=tint(s.mid,-0.2);
  for(let k=0;k<4;k++)gx.fillRect(x0+1+((n>>(k*5))&7)*1.7,y+3.5+((n>>(k*3+1))&3)*1.2,0.5,0.5);
  if(v===0){gx.fillStyle=s.o;gx.fillRect(x0+3,y+3.5,0.5,1);gx.fillRect(x0+3.5,y+4.5,0.5,1);gx.fillRect(x0+4,y+5.5,0.5,1.5);}
  else if(v===1&&!s.noMoss){gx.fillStyle='#5c8a4a';gx.fillRect(x0+2,y,5,0.5);gx.fillRect(x0+3,y+0.5,3,0.5);gx.fillStyle='#7fae62';gx.fillRect(x0+3,y,2,0.5);}
  if(cur){gx.globalAlpha=0.35;gx.fillStyle='#fff';gx.fillRect(x0-1,y-1,17,0.5);gx.globalAlpha=1;}
  if(petal){gx.fillStyle='#f6a6bd';gx.fillRect(x0+(i*5)%12+1,y,1,0.5);gx.fillRect(x0+(i*7)%11+2,y+0.5,0.5,0.5);gx.fillStyle='#ffffff';gx.fillRect(x0+(i*3)%11+3,y,0.5,0.5);}
  if(i%10===0&&i>0)txt(i,x,y+3,1,s.num,'c');
}
function btn(x,y,w,h,label,hint,p){
  const o=p>0?1:0;
  gx.fillStyle='#14203f';gx.fillRect(x,y,w,h);
  gx.fillStyle=p>0?'#3d5fb8':'#4a6fd0';gx.fillRect(x+1,y+1+o,w-2,h-3);
  gx.fillStyle='#7fa2f0';gx.fillRect(x+1,y+1+o,w-2,1);gx.fillRect(x+1,y+1+o,1,h-3);
  gx.fillStyle='#27408b';gx.fillRect(x+1,y+h-3,w-2,2);
  txt(label,x+w/2,y+6+o,2,'#fff','c');
  txt(hint,x+w/2,y+h-10+o,1,'#cfe0ff','c');
}
function draw(){
  const th=TH[selBg],sk=SK[state==='ready'?selSkin:curSkin];
  gx.save();gx.setTransform(4,0,0,4,0,0);
  if(shake>0.2)gx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
  th.bg();
  const lo=Math.max(0,floor-8),hi=floor+14;
  for(let i=hi;i>=lo;i--)stepBlock(Math.round(W/2+xs[i]-camX),Math.round(H*0.6-(i*DY-camY)),i===floor,i,th.st,th.petal);
  let px=W/2+dispX-camX,py=H*0.6-(dispF*DY-camY);
  if(fall){px=W/2+fall.x-camX;py+=fall.y;}
  if(state!=='ready'){
    if(!fall){gx.fillStyle='rgba(0,0,0,.16)';gx.fillRect(Math.round(px)-6,Math.round(py),12,1.5);gx.fillStyle='rgba(0,0,0,.26)';gx.fillRect(Math.round(px)-4,Math.round(py),8,1);}
    const flip=fall?(Math.floor(fall.t*12)%2===0?facing===-1:facing===1):facing===-1;
    drawChar(sk,px,py,flip,fall?0:anim,{par:floor%2,big:floor>0&&floor%10===0&&anim>0,dead:!!fall,turn:fall?0:turnAnim,t:performance.now()});
  }
  const dc0=th.dust||(th.petal?'#f6a6bd':'#efe6cc');
  for(const p of parts){gx.globalAlpha=Math.min(1,p.l*3);gx.fillStyle=p.c||dc0;gx.fillRect(Math.round(p.x*2)/2,Math.round(p.y*2)/2,p.s||1,p.s||1);}
  gx.globalAlpha=1;

  const vg=gx.createRadialGradient(60,90,50,60,90,125);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,10,.4)');gx.fillStyle=vg;gx.fillRect(0,0,W,H);
  
  if(state==='revive_prompt'){
    gx.fillStyle='rgba(0,0,0,0.7)'; gx.fillRect(0,0,W,H);
    txt('부활하시겠습니까?', W/2, H/2 - 20, 1, '#ffd84a', 'c');
    sbtn(W/2 - 35, H/2 + 6, 30, 14, 'YES', false);
    sbtn(W/2 + 5, H/2 + 6, 30, 14, 'NO', false);
    txt('SPACE=YES  ENTER=NO', W/2, H/2 + 28, 1, '#8fa0c0', 'c');
  } else if(state!=='over' && state!=='dead'){
    // 일반 HUD
    txt(floor,W/2,4,3,'#fff','c');
    txt('FLOOR '+floor+'  BEST '+best,W/2,22,1,'#fff','c');
    {const H5=['01010','11111','11111','01110','00100'],hc=revUsed?'#3a4560':'#ff3b5c';H5.forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='1'){gx.fillStyle=(j===0&&i===1&&!revUsed)?'#ff9aaa':hc;gx.fillRect(113.5+i*0.5,30.5+j*0.5,0.5,0.5);}});}
    if(revFlash>0&&Math.floor(performance.now()/120)%2===0)txt('REVIVE!',W/2,48,2,'#ffd84a','c');
    gx.fillStyle='#14203f';gx.fillRect(9,29,102,8);
    gx.fillStyle='#2b3a55';gx.fillRect(10,30,100,6);
    const low=gauge<0.25,blink=Math.floor(performance.now()/150)%2===0;
    gx.fillStyle=low&&blink?'#ff8a9a':low?'#ff3b5c':'#4cd964';
    gx.fillRect(10,30,Math.round(100*gauge),6);
    gx.fillStyle='rgba(255,255,255,.35)';gx.fillRect(10,30,Math.round(100*gauge),1);
    btn(4,146,54,30,'TURN',KM.turn.length?KM.turn.slice(0,3).map(lab).join(' '):'LEFT KEY',pressA);
    btn(62,146,54,30,'CLIMB',KM.climb.length?KM.climb.slice(0,3).map(lab).join(' '):'RIGHT KEY',pressB);
  }

  const bl=Math.floor(performance.now()/450)%2===0;
  if(state==='over'){
    gx.fillStyle='rgba(10,15,40,.78)';gx.fillRect(0,0,W,H);
    txt('GAME OVER',W/2,40,2,'#ff5a6e','c');
    txt('FLOOR',W/2,68,1,'#cfe0ff','c');
    txt(String(floor),W/2,80,3,'#fff','c');
    txt('BEST '+best,W/2,108,1,'#ffd84a','c');
    if(newSkin)txt('NEW SKIN '+newSkin,W/2,124,1,'#ffd84a','c');
    if(bl)txt('CLICK OR ANY KEY',W/2,150,1,'#fff','c');
  }
  if(state==='ready'){
    gx.fillStyle='rgba(10,15,40,.5)';gx.fillRect(0,40,W,100);
    txt('INFINITE',W/2,44,3,'#fff','c');txt('STAIRS',W/2,62,3,'#ffd84a','c');
    const nw=performance.now(),cy0=Math.floor(nw/2000),dn=(nw%2000)/380;drawChar(SK[selSkin],W/2,96,false,dn<1?1-dn:0,{par:cy0%2,big:cy0%3===2,t:nw});
    txt('<',16,102,1,'#fff');txt(SK[selSkin].n,W/2,102,1,'#ffd84a','c');txt('>',100,102,1,'#fff');
    txt('<',16,114,1,'#fff');txt('BG '+TH[selBg].n,W/2,114,1,'#9fe8ff','c');txt('>',100,114,1,'#fff');
    if(bl)txt(custom()?'PRESS YOUR KEY':'PRESS ANY KEY',W/2,127,1,'#fff','c');
    const nx=SK.filter(s=>s.u>best).sort((a,b)=>a.u-b.u)[0];
    if(nx)txt('NEXT SKIN '+nx.n+' '+nx.u+'F',W/2,136,1,'#8fa0c0','c');
    sbtn(4,3,28,10,'KEYS',false);sbtn(88,3,28,10,'SOUND',false);sbtn(90,15,26,10,'DATA',false);
  }
  if(state==='keys')drawKeys();
  else if(state==='data')drawData();
  else if(state==='sound')drawSound();
  
  gx.restore();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(g,0,0,480,720,0,0,cv.width,cv.height);
  requestAnimationFrame(draw);
}
let lastT=performance.now();
function loop(){
  const now=performance.now(),dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;update(dt);requestAnimationFrame(loop);
}
loop();draw();
</script>
